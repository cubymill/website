<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Chase Day - Curtis Miller</title>
  <meta name="description" content="Chase Day - a storm chasing game by Curtis Miller">
  <meta name="author" content="CURTIS BYRNSIDE MILLER">

  <link rel="stylesheet" href="curtismiller.css">

<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href=""/>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  #game-wrap { max-width: 960px; margin: 0 auto; }
  #game {
    display: block; width: 100%; aspect-ratio: 16 / 9; background: #6f7570;
    touch-action: none; user-select: none; -webkit-user-select: none; outline: none;
  }
  #game-wrap p.howto { max-width: 100%; text-align: center; font-size: 12px; font-weight: 300; color: #555; }
  .controls { display: none; gap: 8px; margin-top: 8px; }
  .controls button {
    flex: 1; font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 600; padding: 16px 0;
    background: white; color: black; border: 1px solid black; border-radius: 0;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .controls button.shutter { flex: 2; color: red; border-color: red; }
  .controls button.active { background: black; color: white; }
  .controls button.shutter.active { background: red; color: white; }
  @media (pointer: coarse) { .controls { display: flex; } #game-wrap p.howto.keys { display: none; } }

  #sheet { display: none; margin-top: 24px; }
  #sheet h2 { margin-bottom: 8px; }
  #sheet p { max-width: 100%; text-align: center; }
  #sheet .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; background: #111; padding: 12px; }
  #sheet figure { margin: 0; }
  #sheet figure img { max-width: 100%; width: 100%; display: block; }
  #sheet figcaption { color: #ddd; font-size: 11px; font-weight: 300; margin-top: 4px; line-height: 1.35; }
  #sheet figcaption b { color: white; font-weight: 600; }
  #sheet figure.best figcaption b { color: #ff4a3d; }
  #sheet .again {
    display: block; margin: 16px auto 0; font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 600;
    padding: 10px 28px; background: white; color: red; border: 1px solid red; cursor: pointer;
  }
  #sheet .again:hover { background: red; color: white; }
</style>

</head>

  <header><a href="index.html">INFO</a> / <a href="films.html">FILMS</a> / <a href="photo.html">PHOTO</a></header>

    <body>
      <br>
      <div id="game-wrap">
        <canvas id="game" width="960" height="540" tabindex="0" aria-label="Chase Day, a storm chasing game"></canvas>
        <div class="controls" aria-hidden="true">
          <button data-key="left">&#9664;</button>
          <button data-key="shutter" class="shutter">SHUTTER</button>
          <button data-key="right">&#9654;</button>
        </div>
        <p class="howto keys">&larr; &rarr; / A D drive &nbsp;·&nbsp; SPACE take a photo &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M sound</p>
        <p class="howto">Get close for a better photo, but stay out of the hail and the debris. 24 frames. Sunset ends the chase.</p>

        <section id="sheet" aria-live="polite">
          <h2>Contact Sheet</h2>
          <p id="sheet-summary"></p>
          <div class="grid" id="sheet-grid"></div>
          <button class="again" id="again">CHASE AGAIN</button>
        </section>
      </div>

      <script src="game.js"></script>
    </body>

    <footer>

    </footer>

</html>
