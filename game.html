<head>
  <meta charset="utf-8">

  <title>A Dinner Date with the Sublime - Curtis Miller</title>
  <meta name="description" content="A Dinner Date with the Sublime - a storm chasing game by Curtis Miller">
  <meta name="author" content="CURTIS BYRNSIDE MILLER">

  <link rel="stylesheet" href="curtismiller.css">

<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href=""/>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  #game-wrap { max-width: 960px; margin: 0 auto; }
  #game {
    display: block; width: 100%; aspect-ratio: 16 / 9; background: #76aad6;
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none; user-select: none; -webkit-user-select: none; outline: none;
  }
  #game-wrap p.howto { max-width: 100%; text-align: center; font-size: 12px; font-weight: 300; color: #555; }
  .controls { display: none; gap: 8px; margin-top: 8px; }
  .controls button {
    flex: 1; font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 600; padding: 16px 0;
    background: white; color: black; border: 1px solid black; border-radius: 0;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .controls button.shutter { flex: 2; color: red; border-color: red; }
  .controls button.active { background: black; color: white; }
  .controls button.shutter.active { background: red; color: white; }
  @media (pointer: coarse) { .controls { display: flex; } #game-wrap p.howto.keys { display: none; } }

</style>

</head>

  <header><a href="index.html">INFO</a> / <a href="films.html">FILMS</a> / <a href="photo.html">PHOTO</a></header>

    <body>
      <br>
      <div id="game-wrap">
        <canvas id="game" width="960" height="540" tabindex="0" aria-label="A Dinner Date with the Sublime, a storm chasing game"></canvas>
        <div class="controls" aria-hidden="true">
          <button data-key="left">&#9664;</button>
          <button data-key="zoom">ZOOM</button>
          <button data-key="shutter" class="shutter">SHUTTER</button>
          <button data-key="right">&#9654;</button>
        </div>
        <p class="howto keys">&larr; &rarr; / A D drive &nbsp;·&nbsp; hold Z / SHIFT zoom &nbsp;·&nbsp; SPACE take a photo, advance text &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M sound</p>
        <p class="howto">Get close, or zoom in, for a better photo, but stay out of the hail and the debris. 24 frames. Sunset ends the chase. Sound on.</p>

      </div>

      <script src="game.js"></script>
    </body>
